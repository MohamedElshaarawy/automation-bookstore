# HTML
# Archive your static HTML project and save it with the build record.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- master

pool:
  vmImage: ubuntu-latest

stages:

# =========================
# 1️⃣ BUILD STAGE
# =========================
- stage: Build
  displayName: Build HTML
  jobs:
  - job: BuildJob
    steps:
    - checkout: self

    - task: ArchiveFiles@2
      displayName: Archive HTML
      inputs:
        rootFolderOrFile: '$(Build.SourcesDirectory)'
        includeRootFolder: false

    - task: PublishBuildArtifacts@1
      displayName: Publish Artifacts

# =========================
# 2️⃣ POSTMAN TESTS (BEFORE DEPLOY ✅)
# =========================
- stage: Postman_API_Tests
  displayName: Run Postman API Tests
  dependsOn: Build
  condition: succeeded()

  jobs:
  - job: RunPostman
    displayName: Execute Postman Collection
    pool:
      vmImage: ubuntu-latest

    steps:
    - checkout: self

    # ✅ Correct Node task
    - task: UseNode@1
      displayName: Install Node.js
      inputs:
        versionSpec: '20.x'

    # ✅ Install Newman + HTML reporter
    - script: |
        npm install -g newman newman-reporter-htmlextra
        newman --version
      displayName: Install Newman


    # ✅ Run Postman + generate reports
    - script: |
        mkdir -p newman-report

        newman run postman/postmanTestCollection.postman_collection.json \
          --reporters cli,junit,htmlextra \
          --reporter-junit-export newman-report/junit.xml \
          --reporter-htmlextra-export newman-report/index.html \
          --reporter-htmlextra-title "QC Website API Tests" \
          --reporter-htmlextra-darkTheme
      displayName: Run Postman API Tests

    # ✅ Publish JUnit results (Tests tab)
    - task: PublishTestResults@2
      displayName: Publish Postman Results
      condition: always()
      inputs:
        testResultsFormat: JUnit
        testResultsFiles: 'newman-report/junit.xml'
        failTaskOnFailedTests: true

    # ✅ Publish HTML report (Artifacts tab)
    - task: PublishPipelineArtifact@1
      displayName: Publish Newman HTML Report
      condition: always()
      inputs:
        targetPath: 'newman-report'
        artifactName: 'Postman-HTML-Report'


    
# =========================
# UI TESTS (SELENIUM)
# =========================
- stage: UI_Tests
  displayName: Run Selenium UI Tests
  dependsOn: Postman_API_Tests
  jobs:
  - job: Selenium
    steps:
    - task: JavaToolInstaller@0
      inputs:
        versionSpec: '11'
        jdkArchitectureOption: 'x64'
        jdkSourceOption: 'PreInstalled'

    - task: Maven@4
      inputs:
        mavenPomFile: UI_automation/pom.xml
        goals: clean test
        publishJUnitResults: true
        testResultsFiles: '**/surefire-reports/TEST-*.xml'

